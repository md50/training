  trimmer:
    id: getOrderDocument
    eventFilter: 
      - filter:
          segment: MSH
          field: 9.1
          repetition: 1
          value: ORM
      - filter:
          segment: MSH 
          fields: 9.1
          repetitions: 1 
          value: IML
    data:
      - segment:
        id: MSH
        active: True
        fields: 4, 6, 7
        repetitions: 1, 2
      - segment:
        id: OBR
        active: True
        fields: 1,2,7,9,11,14,18,19